global:
  scrape_interval: "5s"
  scrape_timeout: "5s"
  evaluation_interval: "1m"
  body_size_limit: "0"
  sample_limit: 0
  label_limit: 0
  label_name_length_limit: 0
  label_value_length_limit: 0
  target_limit: 0

scrape_configs:
  - job_name: 'sync-mangas'
    static_configs:
      - targets: ['host.docker.internal:8000']